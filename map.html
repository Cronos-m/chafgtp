<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Map Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
        #map-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="placeholder" class="flex flex-col items-center justify-center h-full text-neutral-500 text-sm font-mono">
        <span>Esperando búsqueda de Maps...</span>
    </div>
    <iframe id="map-frame" class="hidden" src=""></iframe>

    <script>
        const MAP_QUERY_KEY = 'mentalism_active_map_query';
        let lastStamp = 0;

        function applyPayload(raw) {
            if (!raw) return;
            let q = raw, t = 0;
            try { const o = JSON.parse(raw); q = o.q; t = o.t || 0; } catch (e) {}
            if (!q || (t && t === lastStamp)) return;
            lastStamp = t;
            const iframe = document.getElementById('map-frame');
            iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(q)}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
            iframe.classList.remove('hidden');
            document.getElementById('placeholder').classList.add('hidden');
        }

        const check = () => { try { applyPayload(localStorage.getItem(MAP_QUERY_KEY)); } catch (e) {} };

        window.addEventListener('storage', e => { if (e.key === MAP_QUERY_KEY) applyPayload(e.newValue); });
        try { new BroadcastChannel('mentalism_map').onmessage = e => applyPayload(e.data); } catch (e) {}
        document.addEventListener('visibilitychange', check);
        setInterval(check, 1000); // respaldo por si el navegador no emite eventos entre pestañas/PWA
        window.addEventListener('DOMContentLoaded', check);
    </script>
</body>
</html>
