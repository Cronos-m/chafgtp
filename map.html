<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapas IA</title>
    <link rel="icon" type="image/png" href="icon-map.png">
    <link rel="apple-touch-icon" href="icon-map.png">
    <link rel="manifest" href="map-manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mapas IA">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
        #map-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="placeholder" class="flex flex-col items-center justify-center h-full text-neutral-500 text-sm font-mono">
        <span>Esperando búsqueda de Maps...</span>
    </div>
    <iframe id="map-frame" class="hidden" src=""></iframe>

    <script>
        const MAP_QUERY_KEY = 'mentalism_active_map_query';
        const MAP_RELAY_TOPIC = 'mentalismo-915226b1e6fa7181'; // debe ser IGUAL en index.html
        const RELAY_URL = 'https://ntfy.sh/' + MAP_RELAY_TOPIC;
        let lastStamp = 0;

        function applyPayload(raw) {
            if (!raw) return;
            let q = raw, t = 0;
            try { const o = JSON.parse(raw); q = o.q; t = o.t || 0; } catch (e) {}
            if (!q || (t && t === lastStamp)) return;
            lastStamp = t;
            const iframe = document.getElementById('map-frame');
            iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(q)}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
            iframe.classList.remove('hidden');
            document.getElementById('placeholder').classList.add('hidden');
        }

        const check = () => { try { applyPayload(localStorage.getItem(MAP_QUERY_KEY)); } catch (e) {} };

        window.addEventListener('storage', e => { if (e.key === MAP_QUERY_KEY) applyPayload(e.newValue); });
        try { new BroadcastChannel('mentalism_map').onmessage = e => applyPayload(e.data); } catch (e) {}
        // Relay: tiempo real (SSE) + consulta de respaldo de los últimos segundos
        function relayPoll(since) {
            fetch(`${RELAY_URL}/json?poll=1&since=${since}`).then(r => r.text()).then(txt => {
                const msgs = txt.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } })
                    .filter(o => o && o.event === 'message');
                if (msgs.length) applyPayload(msgs[msgs.length - 1].message);
            }).catch(() => {});
        }
        function relayListen() {
            try {
                const es = new EventSource(`${RELAY_URL}/sse`);
                es.onmessage = e => {
                    try { const o = JSON.parse(e.data); if (o.event === 'message') applyPayload(o.message); } catch (err) {}
                };
            } catch (e) {}
        }
        relayListen();
        relayPoll('20s');
        document.addEventListener('visibilitychange', () => { check(); if (!document.hidden) relayPoll('20s'); });
        setInterval(check, 1000); // respaldo por si el navegador no emite eventos entre pestañas/PWA
        window.addEventListener('DOMContentLoaded', check);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./map-sw.js', { scope: './map.html' }).catch(e => console.log('SW map error:', e));
            });
        }
    </script>
</body>
</html>
